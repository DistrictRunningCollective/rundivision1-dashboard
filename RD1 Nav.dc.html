<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<style>
  .rd1-nav-drop { position:relative; }
  .rd1-nav-drop-menu { position:absolute; top:100%; left:-14px; padding-top:14px; display:none; flex-direction:column; min-width:190px; z-index:30; }
  .rd1-nav-drop-menu-inner { background:var(--color-surface); border:1px solid var(--color-divider); border-radius:var(--radius-md); padding:6px; box-shadow:var(--shadow-md); }
  .rd1-nav-drop:hover .rd1-nav-drop-menu { display:flex; }
  .rd1-nav-drop-menu a { display:block; padding:8px 12px; border-radius:6px; color:var(--color-neutral-300); text-decoration:none; font-size:13px; white-space:nowrap; }
  .rd1-nav-drop-menu a:hover { background:var(--color-neutral-800); color:var(--color-text); }
  .rd1-nav-drop-menu .rd1-nav-drop-kicker { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--color-neutral-600); padding:6px 12px 4px; }
</style>
</helmet>

<div style="display:flex; align-items:center; justify-content:space-between; gap:24px; padding:14px 32px; border-bottom:1px solid var(--color-divider); font-family:var(--font-body)">
  <a href="RD1 Dashboard Concepts.dc.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; flex-shrink:0">
    <span style="font-family:var(--font-heading); font-weight:600; font-size:13px; letter-spacing:.06em; color:var(--color-accent-300); border:1px solid var(--color-accent-700); border-radius:4px; padding:3px 7px">RD1</span>
    <span style="font-family:var(--font-heading); font-weight:500; font-size:14px; color:var(--color-text)">RunDivision1</span>
  </a>
  <div style="display:flex; gap:22px; font-size:13px; white-space:nowrap">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="8">
      <sc-if value="{{ l.dropdown }}" hint-placeholder-val="{{ false }}">
        <div class="rd1-nav-drop">
          <a href="{{ l.href }}" style="color:{{ l.color }}; text-decoration:none; white-space:nowrap">{{ l.label }} ▾</a>
          <div class="rd1-nav-drop-menu">
            <div class="rd1-nav-drop-menu-inner">
              <div class="rd1-nav-drop-kicker">{{ l.dropdownKicker }}</div>
              <sc-for list="{{ l.items }}" as="d" hint-placeholder-count="3">
                <a href="{{ d.href }}">{{ d.label }}</a>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ l.plain }}" hint-placeholder-val="{{ true }}">
        <a href="{{ l.href }}" style="color:{{ l.color }}; text-decoration:none; white-space:nowrap">{{ l.label }}</a>
      </sc-if>
    </sc-for>
  </div>
  <sc-if value="{{ hasCta }}" hint-placeholder-val="{{ false }}">
    <a href="{{ ctaHref }}" class="btn btn-primary" style="white-space:nowrap; flex-shrink:0">{{ ctaLabel }}</a>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;&quot;,&quot;seasonzero&quot;,&quot;circuits&quot;,&quot;standings&quot;,&quot;scoring&quot;,&quot;network&quot;,&quot;fund&quot;,&quot;studios&quot;,&quot;teams&quot;,&quot;shop&quot;]},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const CIRCUITS = [
  { label: 'All circuits', href: 'RD1 Season Zero.dc.html#circuits' },
  { label: 'Washington, DC — District Running Collective', href: 'RD1 Challenge DC.dc.html' },
  { label: 'Nashville — 6RUN5', href: 'RD1 Challenge Nashville.dc.html' }
];

const TEAMS = [
  { id:'det', name:'WERUN313', city:'Detroit' },
  { id:'chi', name:'PEACE RUNNERS 773', city:'Chicago' },
  { id:'dc',  name:'District Running Collective', city:'Washington, DC' },
  { id:'la',  name:'KEEPITRUNHUNDRED', city:'Los Angeles' },
  { id:'mke', name:'FEAR MKE', city:'Milwaukee' },
  { id:'cvl', name:'PROLYFYCK RUN CREWW', city:'Charlottesville' },
  { id:'stl', name:'STL RUN CREW', city:'St. Louis' },
  { id:'nsh', name:'6RUN5', city:'Nashville' },
  { id:'bos', name:'PIONEERS RUN CREW', city:'Boston' },
  { id:'atl', name:'ATLANTA RUN CLUB', city:'Atlanta' }
];
const TEAM_LINKS = [
  { label: 'All teams', href: 'RD1 Teams.dc.html' },
  ...TEAMS.map(t => ({
    label: t.name + ' — ' + t.city,
    href: t.id === 'dc' ? 'RD1 Team DRC.dc.html'
        : t.id === 'chi' ? 'RD1 Studios Crew Report.dc.html'
        : t.id === 'atl' ? 'RD1 Team Atlanta.dc.html'
        : t.id === 'bos' ? 'RD1 Team Pioneers.dc.html'
        : 'RD1 Teams.dc.html#' + t.id
  }))
];

const ITEMS = [
  ['Season Zero', 'RD1 Season Zero.dc.html', 'seasonzero'],
  ['Circuits', 'RD1 Season Zero.dc.html#circuits', 'circuits'],
  ['Standings', 'RD1 Standings.dc.html', 'standings'],
  ['Scoring', 'RD1 Scoring.dc.html', 'scoring'],
  ['Network', 'RD1 Network.dc.html', 'network'],
  ['Fund', 'RD1 Fund.dc.html', 'fund'],
  ['Studios', 'RD1 Studios.dc.html', 'studios'],
  ['Teams', 'RD1 Teams.dc.html', 'teams'],
  ['Shop', 'RD1 Shop.dc.html', 'shop']
];

class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || '';
    const ctaLabel = this.props.ctaLabel;
    const ctaHref = this.props.ctaHref;
    return {
      links: ITEMS.map(([label, href, key]) => {
        const color = key === active ? 'var(--color-text)' : 'var(--color-neutral-400)';
        if (key === 'circuits') return { label, href, color, dropdown: true, plain: false, dropdownKicker: 'City circuits', items: CIRCUITS };
        if (key === 'teams') return { label, href, color, dropdown: true, plain: false, dropdownKicker: 'Founding teams', items: TEAM_LINKS };
        return { label, href, color, dropdown: false, plain: true, items: [] };
      }),
      hasCta: !!(ctaLabel && ctaHref),
      ctaLabel: ctaLabel || '',
      ctaHref: ctaHref || '#'
    };
  }
}
</script>
</body>
</html>
